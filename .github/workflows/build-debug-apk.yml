name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - v0/brief-atmosphere-navigation

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: v0/brief-atmosphere-navigation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found on the GitHub-hosted runner." >&2
            exit 1
          fi

          echo "Android SDK location before fallback: $ANDROID_HOME"
          echo "Installed Android SDK packages before fallback:"
          "$SDKMANAGER" --list_installed

          # Feed licenses non-interactively; never wait for terminal input in CI.
          yes | timeout 120 "$SDKMANAGER" --licenses >/dev/null

          required_packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
          )
          installed_packages="$($SDKMANAGER --list_installed)"
          missing_packages=()
          for package in "${required_packages[@]}"; do
            if ! grep -Fq "${package} |" <<< "$installed_packages"; then
              missing_packages+=("$package")
            fi
          done

          if ((${#missing_packages[@]} > 0)); then
            echo "Installing missing Android SDK packages: ${missing_packages[*]}"
            if ! "$SDKMANAGER" --install "${missing_packages[@]}" </dev/null; then
              echo "Android SDK installation failed for: ${missing_packages[*]}" >&2
              exit 1
            fi
          else
            echo "All required Android SDK packages are already installed; reusing them."
          fi

          echo "Android SDK location after fallback: $ANDROID_HOME"
          echo "Installed Android SDK packages after fallback:"
          "$SDKMANAGER" --list_installed

          final_packages="$($SDKMANAGER --list_installed)"
          for package in "${required_packages[@]}"; do
            if ! grep -Fq "${package} |" <<< "$final_packages"; then
              echo "Required Android SDK package is unavailable after setup: $package" >&2
              exit 1
            fi
          done

      - name: Diagnose Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager --list_installed

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Brief Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brief-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

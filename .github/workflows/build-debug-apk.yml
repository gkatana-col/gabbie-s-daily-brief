name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - v0/brief-atmosphere-navigation

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: v0/brief-atmosphere-navigation

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -d "/opt/android-sdk" ]; then
            SDK_ROOT="/opt/android-sdk"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          else
            echo "ERROR: Android SDK was not found on the GitHub Actions runner." >&2
            exit 1
          fi

          echo "Detected Android SDK: $SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/tools/bin" >> "$GITHUB_PATH"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager was not found." >&2
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          required_packages=(
            "platform-tools"
            "platforms;android-36"
            "build-tools;36.0.0"
          )
          installed_packages="$($SDKMANAGER --list_installed 2>/dev/null || true)"
          missing_packages=()

          for package in "${required_packages[@]}"; do
            if grep -Fq "$package" <<< "$installed_packages"; then
              echo "Already installed: $package"
            else
              echo "Missing: $package"
              missing_packages+=("$package")
            fi
          done

          if [ "${#missing_packages[@]}" -gt 0 ]; then
            echo "Installing only missing Android SDK packages:"
            printf ' - %s\n' "${missing_packages[@]}"
            yes | timeout 120 "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "${missing_packages[@]}"
          else
            echo "All required Android SDK packages are already installed."
            echo "Skipping SDK installation."
          fi

          installed_packages="$($SDKMANAGER --list_installed 2>/dev/null || true)"
          for package in "${required_packages[@]}"; do
            if ! grep -Fq "$package" <<< "$installed_packages"; then
              echo "ERROR: Required Android SDK package was not installed: $package" >&2
              exit 1
            fi
          done

          test -d "$ANDROID_HOME/platforms/android-36" || {
            echo "ERROR: platforms;android-36 was not installed." >&2
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/36.0.0" || {
            echo "ERROR: build-tools;36.0.0 was not installed." >&2
            exit 1
          }
          test -d "$ANDROID_HOME/platform-tools" || {
            echo "ERROR: platform-tools was not installed." >&2
            exit 1
          }
          echo "Android SDK verification successful."

      - name: Diagnose Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          sdkmanager --list_installed

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Diagnose web build output
        shell: bash
        run: |
          set -euo pipefail
          echo "Build output:"
          find dist -maxdepth 3 -type f | sort | head -100

          echo "Capacitor webDir:"
          node --input-type=module -e "import fs from 'node:fs'; const config = fs.readFileSync('./capacitor.config.ts', 'utf8'); const match = config.match(/webDir:\s*['\\\"]([^'\\\"]+)['\\\"]/); if (!match) throw new Error('Unable to determine webDir from capacitor.config.ts'); console.log(match[1]);"

          test -f dist/client/index.html || {
            echo "ERROR: npm run build did not produce dist/client/index.html." >&2
            exit 1
          }

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Brief Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brief-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
